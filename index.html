<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divulga Novo Remanso</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><img class="logo" src="/logo.png"><div><h1>Divulga Novo Remanso</h1><small>Cadastre sua empresa e divulgue para a região</small></div></header><main class="wrap"><section class="hero"><h2>Divulgue sua empresa</h2><p>Escolha um plano, faça seu cadastro e envie as informações para análise.</p><div class="grid"><div class="plan"><b>1 semana</b><div class="price">R$ 70</div></div><div class="plan"><b>2 semanas</b><div class="price">R$ 90</div></div><div class="plan"><b>3 semanas</b><div class="price">R$ 120</div></div><div class="plan"><b>1 mês</b><div class="price">R$ 150</div></div></div></section><section class="card"><h2>Cadastro</h2><form id="form"><div class="row"><label>Seu nome<input name="nome" required></label><label>Empresa/negócio<input name="negocio" required></label></div><div class="row"><label>Telefone/WhatsApp<input name="telefone" required></label><label>Plano<select name="plano" required><option value="">Selecione</option><option>1 semana — R$ 70</option><option>2 semanas — R$ 90</option><option>3 semanas — R$ 120</option><option>1 mês — R$ 150</option></select></label></div><label>Status do PIX<select name="pixStatus"><option value="aguardando">Ainda vou pagar</option><option value="pago">Já paguei</option></select></label><button class="btn">Enviar cadastro</button></form><p id="msg"></p></section><section class="card"><h2>Empresas aprovadas</h2><div id="publicList" class="empty">Carregando...</div></section></main><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
